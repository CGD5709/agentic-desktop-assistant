spring.application.name=execution-service

# Conexión a RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ==============================================================================
# CONFIGURACIÓN DE CORREO MULTI-CUENTA (GMAIL + OUTLOOK)
# Las credenciales se inyectan mediante Variables de Entorno para evitar subirlas a Git
# ==============================================================================

# 1. Cuenta Gmail
mail.accounts.gmail.user=${GMAIL_USER:}
mail.accounts.gmail.password=${GMAIL_PASSWORD:}
mail.accounts.gmail.imap-host=${GMAIL_IMAP_HOST:imap.gmail.com}
mail.accounts.gmail.imap-port=${GMAIL_IMAP_PORT:993}
mail.accounts.gmail.smtp-host=${GMAIL_SMTP_HOST:smtp.gmail.com}
mail.accounts.gmail.smtp-port=${GMAIL_SMTP_PORT:587}
mail.accounts.gmail.enabled=${GMAIL_ENABLED:true}

# 2. Cuenta Outlook (Deshabilitada)
mail.accounts.outlook.enabled=${OUTLOOK_ENABLED:false}



